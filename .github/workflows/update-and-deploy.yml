
name: Update Turkey data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,14 * * *'

permissions:
  contents: read

concurrency:
  group: turkey-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::CBRT
            any::jsonlite
            any::zoo
            any::R6
            any::httr
            any::readxl
            any::openxlsx
          cache: true

      - name: Verify R dependencies
        run: |
          Rscript -e '
            pkgs <- c("CBRT", "jsonlite", "zoo", "R6",
                      "httr", "readxl", "openxlsx")

            missing <- pkgs[!vapply(
              pkgs, requireNamespace,
              logical(1), quietly = TRUE
            )]

            if (length(missing) > 0) {
              stop("Missing packages: ",
                   paste(missing, collapse = ", "))
            }

            for (pkg in pkgs) {
              cat(pkg, ":",
                  as.character(packageVersion(pkg)), "\n")
            }

            stopifnot(
              packageVersion("CBRT") >= "0.2.0"
            )
          '


      - name: List GDP catalogue
        run: |
          Rscript R/list_gdp_catalogue.R
          cat gdp_catalogue.csv

      - name: Update EVDS and TurkStat data
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: Rscript R/update_data.R

      - name: Validate snapshot
        run: python3 tests/validate_snapshot.py site/drive_ingestion/snapshots/turkey.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
