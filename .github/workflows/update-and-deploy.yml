name: Update Turkey data and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,14 * * *'
permissions:
  contents: read
concurrency:
  group: turkey-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("CBRT", "jsonlite", "zoo", "R6", "httr", "readxl", "openxlsx"), repos="https://cloud.r-project.org")'
      - name: Update EVDS and TurkStat data
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: Rscript R/update_data.R
      - name: Validate snapshot
        run: python3 tests/validate_snapshot.py site/drive_ingestion/snapshots/turkey.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
